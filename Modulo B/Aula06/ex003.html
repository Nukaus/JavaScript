<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body{
            background-color: rgb(183, 218, 238);
            font: normal 20pt Arial, sans-serif;
            color: rgb(34, 34, 34);
        }
        h1{
            color: rgb(0, 102, 204);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição</p>

    <script>
        var n1 = Number(window.prompt("Digite um número:")) // window.prompt retorna string
        var n2 = Number(window.prompt("Digite outro número:"))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} + ${n2} é igual a ${s}`) 
        // + serve para adição e concatenação
        // + para soma precisa number + number
        // string + string = concatenação
    </script>
</body>
</html>
