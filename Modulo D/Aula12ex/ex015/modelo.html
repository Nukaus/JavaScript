<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Verificador de idade</h1>
    </header>
    <section>
        <div>
            <p>Ano de nascimento:
                <input type="number" name="txtano" id="txtano" min="1">
            </p>
            <p>Genero:
                <input type="radio" name="radgen" id="mas" checked>
                <label for="mas">Masculino</label>
                <input type="radio" name="radgen" id="fem">
                <label for="fem">Feminino</label>
            </p>
            <p><button type="button" onclick="verificar()">Verificar</button></p>
        </div>
        <div id="res">
            preencha os dados acima para ver o resultado!
        </div>
    </section>
    <footer>
        <p>&copy; Cristiano P. Santos</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
