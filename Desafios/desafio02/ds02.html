<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var nomeCompleto = window.prompt('Digite seu nome completo:')
        window.alert(`Seu nome em MAIÚSCULAS é ${nomeCompleto.toUpperCase()}`)
        window.alert(`Seu nome em minúsculas é ${nomeCompleto.toLowerCase()}`)
        window.alert(`O Seu tamanho tem ${nomeCompleto.length} caracteres`)
    </script>
</body>
</html>
