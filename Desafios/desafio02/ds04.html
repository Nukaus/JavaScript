<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var nomeAluno = String(window.prompt('Qual é o nome do aluno ?'))
        var n1 = Number.parseFloat(window.prompt('Qual foi a primeira nota ?'))
        var n2 = Number.parseFloat(window.prompt('Qual foi a segunda nota ?'))
        var media = (n1 + n2) / 2
        window.alert(`O aluno ${nomeAluno} teve as respectivas notas ${n1} e ${n2} sua média foi de ${media}`)
    </script>
</body>
</html>
