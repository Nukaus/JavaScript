<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="texto" id="texto">
    <p></p>
    <input type="button" value="verificar" onclick="check()">

    <script>
        function check(){
            var checar = (texto.value.length)
            var par = window.document.getElementsByTagName('p')[0]
            par.innerHTML = `Você digitou ${checar} caracteres`
            
        }
        
    </script>
</body>
</html>
