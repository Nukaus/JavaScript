<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde vives ?</title>
</head>
<body>
    <h1>Qual país você mora ?</h1>
    <input type="text" name="txtpais" id="txtpais">
    <p></p>
    <button type="button" onclick="check()">Verificar</button>

    <script>
        function check(){
            var pais = window.document.getElementById('txtpais').value
            var texto = window.document.getElementsByTagName('p')[0]
            if (pais.toUpperCase() == 'BRASIL'){
                texto.innerHTML = `<p>Vivendo em ${pais} você é Brasileiro</p>`
            }else{
                texto.innerHTML = `<p>Vivendo em ${pais} você é Estrangeiro</p>`
            }
        }
    </script>
</body>
</html>
