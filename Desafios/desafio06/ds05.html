<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
           margin: 0; 
           padding: 0;
        }
        body{
            font: normal 18px arial;
        }

        input{
            width: 100px;
            margin: 5px;
            padding: 2px;
            border: 1px solid black;
            align-self: center;
        }

        div#form{
            display: flex;
            width: 500px;
            margin: 15px auto;
            padding: 10px;
            border-radius: 5px;
            background-color: rgb(0, 119, 255);
            flex-direction: column;
        }

        div#form h1{
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Times New Roman', Times, serif;
            box-shadow: 2px 2px 2px 1px rgba(0, 0, 0, 0.336);
        }

        button{
            width: 150px;
            align-self: center;
            border: 1px solid black;
            border-radius: 8px;
            padding: 5px;
            margin: 20px 5px 0px 5px;
        }

        div#text{
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            
        }
    </style>
</head>
<body>
    <div id="form">
        <h1>Simulador de Desconto em Loja</h1>
        <input type="number" name="valor" id="valor" placeholder="Valor R$:">

        <div id="botoes">
            <button onclick="check(1)">À vista (10% OFF)</button>
            <button onclick="check(2)">Cartão (5% OFF)</button>
            <button onclick="check(3)">Sem desconto</button>
        </div>

        <div id="text">

        </div>
    </div>

    <script>
        function check(cod){
            var valor = Number(window.document.getElementById('valor').value)
            var res = window.document.getElementById('text')

            switch(cod){
                case 1: 
                    var desc1 = valor - (valor * (10 / 100))
                    res.innerHTML = `<p>O preço do seu produto com desconto de 10% é R$ ${desc1.toFixed(2).replace('.',',')}</p>`
                    break
                case 2: 
                    var desc2 = valor - (valor * (5/ 100))
                    res.innerHTML = `<p>O preço do seu produto com desconto de 5% é R$ ${desc2.toFixed(2).replace('.',',')}</p>`
                    break
                case 3: 
                    res.innerHTML = `<p>O preço do seu produto é R$ ${valor.toFixed(2).replace('.',',')}</p>`
                    break
            }
        }
    </script>
</body>
</html>
