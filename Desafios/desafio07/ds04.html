<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        window.alert('Eu so vou parar quando você digitar Sim')

        var p1 = window.prompt('Posso parar ?')

        while(p1 != 'Sim'){
            window.alert('Eu so vou parar quando você digitar Sim')

            var p1 = window.prompt('Posso parar ?')
        }

        window.alert('Está bem já entendi!')
    </script>
</body>
</html>
