<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        
        var acum = 0
        var cont = 0
        while( cont < 5){
            var n1 = Number(window.prompt('Digite um número:'))
            acum += n1
            cont ++
        }
        window.alert(`${acum}`)
    </script>
</body>
</html>
