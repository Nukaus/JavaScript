<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento para assistência</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        
    </header>
    <main>
        <section>
            <h1>CALCULADORA DE ORÇAMENTOS</h1>
            <div id="conteudo">
                <div id="form">
                   <p id="usuario"><i class="bi bi-person-circle"></i> <input type="text" name="cliente" id="cliente" placeholder="Nome do cliente:"></p>
                    <p><i class="bi bi-phone"></i>
                        <select name="servicos" id="servicos">
                            <option value="50">Aparelhos Celulares</option>
                            <option value="0">Troca de Tela Android</option>
                            <option value="1">Troca de bateria Android</option>
                            <option value="2">Troca de conector de carga Android</option>
                            <option value="3">Troca de alto-falante Android</option>
                            <option value="4">Troca de microfone Android</option>
                            <option value="5">Troca de câmera Android</option>
                            <option value="6">Troca de botão power/volume Android</option>
                            <option value="7">Atualização/Reistalação sistema Android</option>
                            <option value="8">Troca de Tela Iphone 8/SE</option>
                            <option value="9">Troca de Tela Iphone X/XR/XS</option>
                            <option value="10">Troca de Tela Iphone 11</option>
                            <option value="11">Troca de Tela Iphone 12/13</option>
                            <option value="12">Troca de Tela Iphone 14+</option>
                            <option value="13">Troca de bateria Iphone 7/8</option>
                            <option value="14">Troca de bateria Iphone X+</option>
                            <option value="15">Troca tampa traseira Iphone(Já trocada)</option>
                            <option value="16">Troca tampa traseira Iphone(Original)</option>
                            <option value="17">Troca de carcaça Iphone(Original) X/XR/XS</option>
                            <option value="18">Troca de carcaça Iphone(Original) 11</option>
                            <option value="19">Troca de carcaça Iphone(Original) 12/13</option>
                            <option value="20">Troca de carcaça Iphone(Original) 14+</option>
                            <option value="21">Troca de carcaça Iphone(Estilo 17) X/XR/XS</option>
                            <option value="22">Troca de carcaça Iphone(Estilo 17) 11</option>
                            <option value="23">Troca de carcaça Iphone(Estilo 17) 12/13</option>
                            <option value="24">Troca de carcaça Iphone(Estilo 17) 14+</option>
                            <option value="28">Troca conector de carga iPhone 13</option>
                        </select>
                    </p>
                    <p><i class="bi bi-pc-display"></i>
                        <select name="servicospc" id="servicospc">
                            <option value="50">Notebooks/Desktops</option>
                            <option value="25">Troca de tela notebook</option>
                            <option value="27">Troca de bateria notebook</option>
                        </select>
                    </p>
                    <p><i class="bi bi-exclamation-triangle-fill"></i>
                        <select name="risco" id="risco">
                            <option value="1">Padrão</option>
                            <option value="0">Máximo</option>
                        </select>
                    </p>
                    <input type="number" name="peca" id="peca" placeholder="Valor da peça:">
                    <input type="number" name="entrega" id="entrega" placeholder="Taxa de entrega:">
                    <div id="botoes">
                        <button type="button" onclick="inserir()"><i class="bi bi-plus"></i> Inserir</button>
                        <button type="button" onclick="calcular()"><i class="bi bi-calculator"></i> Calcular</button>
                        <button type="button" onclick="novo()">Novo</button>
                    </div>
                </div>
                <div id="nome">
                </div>
                <div id="erro">
                </div>
                <div id="res">
                
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <script src="script.js"></script>
</body>
</html>
