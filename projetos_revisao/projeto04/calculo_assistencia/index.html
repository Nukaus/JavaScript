<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Orçamentos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <main>
        <section class="container">
            <header>
                <h1><i class="bi bi-calculator"></i> Calculadora de Orçamentos</h1>
            </header>

            <div id="conteudo">
                <div id="form">
                    <div class="input-group">
                        <label for="cliente"><i class="bi bi-person"></i> Cliente</label>
                        <input type="text" id="cliente" placeholder="Nome completo">
                    </div>
                    
                    <div class="input-group">
                        <label for="modelo"><i class="bi bi-phone-vibrate"></i> Modelo do Aparelho</label>
                        <input type="text" id="modelo" placeholder="Ex: Samsung A54 / iPhone 11">
                    </div>
                    
                    <div class="input-group">
                        <label for="telefone"><i class="bi bi-whatsapp"></i> WhatsApp do Cliente</label>
                        <input type="number" id="telefone" placeholder="Ex: 31988887777">
                    </div>

                    <div class="input-group">
                        <label for="servicos"><i class="bi bi-phone"></i> Manutenção de Celulares</label>
                        <select id="servicos">
                            <option value="50">Selecione o modelo e serviço...</option>
                            
                            <optgroup label="IPHONE - TELAS (LINHA PREMIUM)">
                                <option value="ip_17pm_tela">iPhone 17 Pro Max - Tela</option>
                                <option value="ip_17p_tela">iPhone 17 Pro - Tela</option>
                                <option value="ip_17_tela">iPhone 17 / 17 Plus - Tela</option>
                                <option value="ip_16pm_tela">iPhone 16 Pro Max - Tela</option>
                                <option value="ip_16p_tela">iPhone 16 Pro - Tela</option>
                                <option value="ip_16_tela">iPhone 16 / 16 Plus - Tela</option>
                                <option value="ip_15pm_tela">iPhone 15 Pro Max - Tela</option>
                                <option value="ip_15p_tela">iPhone 15 Pro - Tela</option>
                                <option value="ip_15_tela">iPhone 15 / 15 Plus - Tela</option>
                                <option value="ip_14pm_tela">iPhone 14 Pro Max - Tela</option>
                                <option value="ip_14p_tela">iPhone 14 Pro - Tela</option>
                                <option value="ip_14_tela">iPhone 14 / 14 Plus - Tela</option>
                            </optgroup>
                    
                            <optgroup label="IPHONE - TELAS (LINHA PADRÃO)">
                                <option value="ip_13_tela">iPhone 13 / 13 Pro - Tela</option>
                                <option value="ip_12_tela">iPhone 12 / 12 Pro - Tela</option>
                                <option value="ip_11pm_tela">iPhone 11 Pro Max - Tela</option>
                                <option value="ip_11_tela">iPhone 11 - Tela</option>
                                <option value="ip_xr_tela">iPhone XR - Tela</option>
                                <option value="ip_x_tela">iPhone X / XS - Tela</option>
                                <option value="ip_8_tela">iPhone 8 / SE (2020/22) - Tela</option>
                            </optgroup>
                    
                            <optgroup label="IPHONE - BATERIAS">
                                <option value="ip_16_17_bat">iPhone 16 / 17 Series - Bateria</option>
                                <option value="ip_14_15_bat">iPhone 14 / 15 Series - Bateria</option>
                                <option value="ip_12_13_bat">iPhone 12 / 13 Series - Bateria</option>
                                <option value="ip_11_bat">iPhone 11 Series - Bateria</option>
                                <option value="ip_x_bat">iPhone X / XR / XS - Bateria</option>
                                <option value="ip_8_bat">iPhone 7 / 8 / SE - Bateria</option>
                            </optgroup>
                    
                            <optgroup label="IPHONE - CARCAÇAS E TAMPAS">
                                <option value="ip_tampa_comum">Troca de Tampa Traseira (Vidro)</option>
                                <option value="ip_carcaca_completa">Troca de Carcaça Completa</option>
                            </optgroup>
                    
                            <optgroup label="ANDROID - SERVIÇOS">
                                <option value="and_tela_premium">Android - Tela (OLED/Original)</option>
                                <option value="and_tela_incell">Android - Tela (Incell/Simples)</option>
                                <option value="and_bat">Android - Troca de Bateria</option>
                                <option value="and_conector">Android - Conector de Carga</option>
                                <option value="and_software">Android - Software / Desbloqueio</option>
                            </optgroup>
                    
                            <optgroup label="OUTROS REPAROS">
                                <option value="desoxidacao">Limpeza Química (Caiu na água)</option>
                                <option value="conector_iphone">Conector de Carga iPhone</option>
                                <option value="camera_reparo">Reparo de Câmeras</option>
                            </optgroup>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="servicospc"><i class="bi bi-pc-display"></i> Informática / Notebooks</label>
                        <select id="servicospc">
                            <option value="50">Selecione o serviço...</option>
                            <optgroup label="TELAS & DISPLAY">
                                <option value="nb_tela_14">Troca de Tela Notebook 14"</option>
                                <option value="nb_tela_15">Troca de Tela Notebook 15.6"</option>
                            </optgroup>
                            <optgroup label="HARDWARE & PERFORMANCE">
                                <option value="nb_ssd">Instalação de SSD + Sistema</option>
                                <option value="nb_ram">Upgrade de Memória RAM</option>
                                <option value="nb_bat">Troca de Bateria Interna</option>
                                <option value="nb_limpeza">Limpeza Interna + Pasta Térmica</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="servicospc"><i class="bi bi-pc-display"></i> Informática</label>
                        <select id="servicospc">
                            <option value="50">Selecione um serviço...</option>
                            <option value="27">Troca de tela notebook</option>
                            <option value="28">Troca de bateria notebook</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label for="risco">Risco</label>
                            <select id="risco">
                                <option value="1">Padrão</option>
                                <option value="0">Máximo</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="peca">Valor Peça</label>
                            <input type="number" id="peca" placeholder="R$ 0,00">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="entrega">Taxa de Entrega</label>
                        <input type="number" id="entrega" placeholder="R$ 0,00">
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label for="tipo_urgencia">Urgência</label>
                            <select id="tipo_urgencia" onchange="toggleUrgencia()">
                                <option value="0">Não (Padrão)</option>
                                <option value="fixo">Valor Fixo (R$)</option>
                                <option value="porcentagem">Porcentagem (%)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="valor_urgencia">Valor Urgência</label>
                            <input type="number" id="valor_urgencia" placeholder="0" disabled>
                        </div>
                    </div>

                    <div id="botoes">
                        <button class="btn-insert" onclick="inserir()"><i class="bi bi-plus-lg"></i> Inserir</button>
                        <button class="btn-calc" onclick="calcular()"><i class="bi bi-check-all"></i> Finalizar</button>
                        <button class="btn-new" onclick="novo()"><i class="bi bi-arrow-clockwise"></i> Novo</button>
                        <button class="btn-whatsapp" onclick="enviarWhatsApp()" style="background: #25D366; color: white; grid-column: span 2;">
                            <i class="bi bi-whatsapp"></i> Enviar Orçamento via WhatsApp
                        </button>
                    </div>
                </div>

                <div id="erro"></div>
                
                <div id="resultado-container">
                    <div id="nome"></div>
                    <div id="res"></div>
                </div>
            </div>
        </section>

        <section class="container history-section" style="margin-top: 20px; max-width: 450px;">
            <header>
                <h2><i class="bi bi-clock-history"></i> Histórico Recente</h2>
            </header>
            <div id="historico-lista">
                <p style="text-align: center; color: #64748b; font-size: 0.9rem;">Nenhum orçamento salvo.</p>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <button class="btn-new" onclick="limparHistorico()" style="background: #94a3b8; grid-column: span 1; margin:0;">
                    <i class="bi bi-trash"></i> Limpar
                </button>
                <button class="btn-pdf" onclick="gerarPDF()" style="background: #e11d48; color: white; margin:0;">
                    <i class="bi bi-file-earmark-pdf"></i> PDF
                </button>
            </div>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
