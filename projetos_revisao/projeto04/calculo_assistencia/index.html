<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Orçamentos</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #007BFF;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h3 {
            color: #333;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        .cascading-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            min-width: 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        select,
        input[type="number"],
        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row .input-group {
            flex: 1;
        }

        .cliente-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .cliente-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: #007BFF;
            width: 100%;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        .btn-success {
            background-color: #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-pdf {
            background-color: #dc3545;
        }

        .btn-pdf:hover {
            background-color: #bb2d3b;
        }

        #erro {
            color: #dc3545;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .carrinho {
            margin-top: 30px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f8f9fa;
            margin-bottom: 10px;
            padding: 15px;
            border-left: 4px solid #007BFF;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .item-detalhes {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .item-nome {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .item-valores {
            font-size: 0.9em;
            color: #666;
        }

        .badge-desconto {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .resumo-total {
            font-size: 1.5em;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
            color: #333;
        }

        .acoes-finais {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .urgencia-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #dc3545;
        }

        .urgencia-group input {
            width: auto;
            transform: scale(1.5);
        }

        .info-entrega {
            margin-bottom: 20px;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .cliente-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                flex-direction: column;
            }

            li {
                flex-direction: column;
                align-items: flex-start;
            }

            li .btn-danger {
                width: 100%;
            }

            .acoes-finais {
                flex-direction: column;
            }

            .acoes-finais .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>
        <i class="bi bi-tools"></i>
        Orçamento
    </h2>

    <!-- ========================================================= -->
    <!-- DADOS DO CLIENTE -->
    <!-- ========================================================= -->

    <div class="cliente-box">

        <div class="section-title">
            <i class="bi bi-person"></i>
            Dados do Cliente
        </div>

        <div class="cliente-grid">

            <div class="input-group">
                <label for="nome">
                    <i class="bi bi-person-fill"></i>
                    Nome do Cliente
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do cliente"
                >
            </div>

            <div class="input-group">
                <label for="telefone">
                    <i class="bi bi-whatsapp"></i>
                    Telefone / WhatsApp
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="(31) 99999-9999"
                >
            </div>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- APARELHO -->
    <!-- ========================================================= -->

    <div class="section-title">
        <i class="bi bi-phone"></i>
        Dados do Aparelho e Serviço
    </div>

    <!-- Grupo Cascading: Tipo > Marca > Modelo > Serviço -->

    <div class="cascading-group">

        <div class="input-group">

            <label for="tipoAparelho">
                <i class="bi bi-display"></i>
                1. Tipo
            </label>

            <select id="tipoAparelho">

                <option value="">
                    Selecione o Tipo...
                </option>

            </select>

        </div>


        <div class="input-group">

            <label for="marcaAparelho">
                <i class="bi bi-tags"></i>
                2. Marca
            </label>

            <select
                id="marcaAparelho"
                disabled
            >

                <option value="">
                    Selecione a Marca...
                </option>

            </select>

        </div>


        <div class="input-group">

            <label for="modeloAparelho">
                <i class="bi bi-phone"></i>
                3. Modelo
            </label>

            <select
                id="modeloAparelho"
                disabled
            >

                <option value="">
                    Selecione o Modelo...
                </option>

            </select>

        </div>


        <div class="input-group">

            <label for="servicoAparelho">
                <i class="bi bi-wrench"></i>
                4. Serviço
            </label>

            <select
                id="servicoAparelho"
                disabled
            >

                <option value="">
                    Selecione o Serviço...
                </option>

            </select>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- DADOS FINANCEIROS -->
    <!-- ========================================================= -->

    <div class="section-title">
        <i class="bi bi-cash-stack"></i>
        Dados Financeiros
    </div>

    <div class="form-row">

        <div class="input-group">

            <label for="risco">
                <i class="bi bi-exclamation-triangle"></i>
                Nível de Risco
            </label>

            <select id="risco">

                <option value="0">
                    Baixo (Cobra Valor Máximo)
                </option>

                <option value="1">
                    Alto (Cobra Média Max/Min)
                </option>

            </select>

        </div>


        <div class="input-group">

            <label for="peca">
                <i class="bi bi-currency-dollar"></i>
                Custo da Peça (R$)
            </label>

            <input
                type="number"
                id="peca"
                placeholder="Ex: 120.50"
                step="0.01"
                min="0"
            >

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- ENTREGA / BUSCA -->
    <!-- ========================================================= -->

    <div class="form-row info-entrega">

        <div class="input-group">

            <label for="entrega">
                <i class="bi bi-truck"></i>
                Taxa de Entrega/Busca (R$)
            </label>

            <input
                type="number"
                id="entrega"
                placeholder="Ex: 20.00"
                step="0.01"
                min="0"
                value="0"
            >

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- URGÊNCIA -->
    <!-- ========================================================= -->

    <div class="urgencia-group">

        <input
            type="checkbox"
            id="urgencia"
        >

        <label for="urgencia">
            Aplicar Taxa de Urgência
            (Adiciona 20% na mão de obra)
        </label>

    </div>


    <div id="erro"></div>


    <!-- ========================================================= -->
    <!-- ADICIONAR -->
    <!-- ========================================================= -->

    <button
        class="btn btn-primary"
        onclick="inserir()"
    >

        <i class="bi bi-plus-circle"></i>
        Adicionar ao Orçamento

    </button>


    <!-- ========================================================= -->
    <!-- RESUMO -->
    <!-- ========================================================= -->

    <div class="carrinho">

        <h3>
            <i class="bi bi-cart-check"></i>
            Serviços Adicionados
        </h3>

        <ul id="listaOrcamento">
            <!-- Itens inseridos via JS -->
        </ul>


        <div class="resumo-total">

            Total Estimado:
            R$

            <span id="valorTotal">
                0.00
            </span>

        </div>


        <!-- ===================================================== -->
        <!-- AÇÕES -->
        <!-- ===================================================== -->

        <div class="acoes-finais">

            <button
                class="btn btn-success"
                onclick="enviarWhatsApp()"
            >

                <i class="bi bi-whatsapp"></i>
                Enviar WhatsApp

            </button>


            <button
                class="btn btn-pdf"
                onclick="gerarPDF()"
            >

                <i class="bi bi-file-pdf"></i>
                Gerar PDF

            </button>

        </div>

    </div>

</div>


<!-- ============================================================= -->
<!-- ORDEM DOS SCRIPTS -->
<!-- ============================================================= -->

<!-- dados.js precisa vir antes do script.js -->
<script src="dados.js"></script>
<script src="script.js"></script>

</body>
</html>
